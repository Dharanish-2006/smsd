server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  include /etc/nginx/security-headers.conf;

  # Load balancers and Docker use this to check the container is alive.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Backend API. Uncomment and point at your backend service once it exists.
  # location /api/ {
  #   proxy_pass http://backend:8000;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }

  # Hashed build files never change, so browsers may cache them for a year.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # The HTML shell must always be re-checked so new releases show up.
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # Single-page app: unknown paths load the app, which shows its own 404.
  location / {
    try_files $uri /index.html;
  }
}
